<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bukti Peminjaman - Perpustakaan</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --primary-accent: #0f172a;
            --accent-gold: #d97706;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-accent));
            color: white;
            padding: 28px 32px;
            text-align: center;
            border-bottom: 4px solid var(--accent-gold);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .content {
            padding: 32px;
        }

        .receipt-card {
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .receipt-row:last-child {
            border-bottom: none;
        }

        .receipt-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .receipt-value {
            font-weight: 600;
            color: var(--text-main);
            text-align: right;
        }

        .badge-status {
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn-action {
            display: block;
            width: 100%;
            text-align: center;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: var(--primary-accent);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Bukti Peminjaman Berhasil</h1>
    </div>

    <div class="content">
        <div class="receipt-card">
            <div class="receipt-row">
                <span class="receipt-label">ID Transaksi</span>
                <span class="receipt-value" th:text="${bukti.idTransaksi}">T12345678</span>
            </div>
            <div class="receipt-row">
                <span class="receipt-label">Nama Anggota</span>
                <span class="receipt-value" th:text="${bukti.namaAnggota}">Nama Anggota</span>
            </div>
            <div class="receipt-row">
                <span class="receipt-label">Judul Buku</span>
                <span class="receipt-value" th:text="${bukti.judulBuku}">Judul Buku</span>
            </div>
            <div class="receipt-row">
                <span class="receipt-label">Tanggal Pinjam</span>
                <span class="receipt-value" th:text="${bukti.tanggalPinjam}">2026-10-29</span>
            </div>
            <div class="receipt-row">
                <span class="receipt-label">Status</span>
                <span class="receipt-value">
                    <span class="badge-status" th:text="${bukti.status}">DIPINJAM</span>
                </span>
            </div>
        </div>

        <a href="/pinjam" class="btn-action">Pinjam Buku Lain</a>
    </div>
</div>

</body>
</html>
